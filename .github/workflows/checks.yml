name: checks
on:
  push:
  pull_request:
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:hosted
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: BR_TRANSPORT=http npm run test:browser
      - run: npm run test:elimination
      - run: npm run test:polish
      - run: npm run test:fieldwork
      - run: npm run test:audio
      - run: npm run test:connection
