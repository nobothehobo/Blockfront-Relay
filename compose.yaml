services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    expose:
      - "3000"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
